# DQN on ContinuousWorld experiment configuration
# Note: DQN discretises continuous action spaces via binning wrappers.
# For native continuous control, use PPO with continuous=true.
env: ContinuousWorld
env_kwargs:
  max_speed: 0.05
  goal_radius: 0.07
  n_hazards: 3
  hazard_radius: 0.08
  max_steps: 300

agent_type: PPO
agent_kwargs:
  hidden_sizes: [128, 128]
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  n_epochs: 4
  batch_size: 64
  rollout_steps: 512
  max_grad_norm: 0.5

n_episodes: 500
max_steps_per_episode: 300
eval_every: 50
n_eval_episodes: 5
run_dir: runs/ppo_continuous
save_every: 50
use_tensorboard: false
print_every: 10
device: cpu
seed: 42
