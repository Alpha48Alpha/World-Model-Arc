env:
  name: GridWorld
  height: 8
  width: 8
  obs_mode: flat
  max_steps: 200
  slip_prob: 0.0
  goals:
    - [7, 7]
  hazards:
    - [3, 3]
    - [4, 4]
  walls:
    - [2, 1]
    - [2, 2]
    - [2, 3]

agent:
  type: DQN
  lr: 0.001
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 30000
  target_update_freq: 500
  buffer_capacity: 50000
  batch_size: 64
  hidden_dims: [128, 128]
  activation: relu
  dueling: false
  clip_grad: 10.0

training:
  n_episodes: 500
  eval_interval: 50
  eval_episodes: 10
  log_interval: 10
  checkpoint_interval: 100
  seed: 42
  device: cpu

logging:
  log_dir: runs
  experiment_name: dqn_gridworld
  use_tensorboard: true
