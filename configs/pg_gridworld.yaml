env:
  name: GridWorld
  height: 8
  width: 8
  obs_mode: flat
  max_steps: 200
  slip_prob: 0.0
  goals:
    - [7, 7]
  hazards:
    - [3, 3]
    - [4, 4]
  walls:
    - [2, 1]
    - [2, 2]
    - [2, 3]

agent:
  type: PG
  lr: 0.001
  gamma: 0.99
  entropy_coef: 0.01
  hidden_dims: [128, 128]
  activation: relu
  clip_grad: 1.0

training:
  n_episodes: 500
  eval_interval: 50
  eval_episodes: 10
  log_interval: 10
  checkpoint_interval: 100
  seed: 42
  device: cpu

logging:
  log_dir: runs
  experiment_name: pg_gridworld
  use_tensorboard: true
