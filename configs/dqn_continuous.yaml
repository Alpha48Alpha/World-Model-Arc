env:
  name: ContinuousWorld
  max_steps: 300
  dense_reward: true
  goals:
    - [0.85, 0.85]
  hazards:
    - [0.5, 0.5]

agent:
  type: DQN
  lr: 0.001
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 50000
  target_update_freq: 1000
  buffer_capacity: 100000
  batch_size: 128
  hidden_dims: [256, 256]
  activation: relu
  dueling: true
  clip_grad: 10.0

training:
  n_episodes: 1000
  eval_interval: 100
  eval_episodes: 10
  log_interval: 20
  checkpoint_interval: 200
  seed: 42
  device: cpu

logging:
  log_dir: runs
  experiment_name: dqn_continuous
  use_tensorboard: true
